<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Identity - AI Email Responder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
        }
        h1 {
            color: #6366f1;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            background-color: #22c55e;
            color: #000000;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Oura Identity AI Agent</h1>
        <p>Automated Client Email Responder System is up and running in the background.</p>
        <div class="badge">System Active</div>
    </div>
</body>
</html>
